<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf7">
<title>Claire Baby Tracker</title>
<style>
:root{--bg:#fffaf7;--card:#fff;--text:#292421;--muted:#7a716b;--line:#eadfd8;--accent:#bd7867;--soft:#f6e8e2;--danger:#a33}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
main{max-width:760px;margin:auto;padding:18px 14px 50px}h1{font-size:25px;margin:4px 0}.sub{color:var(--muted);margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card,.panel{background:var(--card);border:1px solid var(--line);border-radius:16px}
.card{padding:13px}.label{font-size:13px;color:var(--muted)}.value{font-size:24px;font-weight:700;margin-top:3px}
.panel{padding:15px;margin-top:14px}h2{font-size:17px;margin:0 0 12px}
.tabs,.actions{display:flex;flex-wrap:wrap;gap:8px}.tab,button{min-height:44px;border-radius:11px;border:1px solid var(--line);background:white;padding:9px 13px;font-size:15px;color:var(--text)}
.tab.active,.primary{background:var(--accent);border-color:var(--accent);color:white}.quick{background:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{font-size:13px;color:var(--muted);display:block}input,select{width:100%;font-size:16px;margin-top:5px;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--text)}
form{margin-top:12px}.hidden{display:none}.entry{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.entry:last-child{border-bottom:0}.entry-title{font-weight:600}.entry-meta{font-size:13px;color:var(--muted);margin-top:3px}.delete{border:0;background:none;color:var(--muted);padding:4px;min-height:auto}
.day{padding:12px 0;border-bottom:1px solid var(--line)}.day:last-child{border-bottom:0}.day-head{font-weight:700}.day-stats{font-size:14px;color:var(--muted);margin-top:5px;line-height:1.6}
.note{font-size:12px;color:var(--muted);line-height:1.45;margin-top:12px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}.empty{color:var(--muted);text-align:center;padding:20px 5px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
  <h1>Claire Baby Tracker</h1>
  <div class="sub" id="todayLabel"></div>

  <section class="stats">
    <div class="card"><div class="label">今日奶量</div><div class="value"><span id="milk">0</span> <small>mL</small></div></div>
    <div class="card"><div class="label">喂奶次数</div><div class="value" id="feeds">0</div></div>
    <div class="card"><div class="label">Wet diapers</div><div class="value" id="pees">0</div></div>
    <div class="card"><div class="label">Poops</div><div class="value" id="poops">0</div></div>
  </section>

  <section class="panel">
    <h2>快速记录</h2>
    <div class="tabs">
      <button class="tab active" data-tab="feed">🍼 Feed</button>
      <button class="tab" data-tab="diaper">💧 Diaper</button>
      <button class="tab" data-tab="health">⚖️ Weight / TcB</button>
    </div>

    <form id="feedForm">
      <div class="grid">
        <label>时间<input id="feedTime" type="datetime-local" required></label>
        <label>奶量 (mL)<input id="amount" type="number" min="1" max="300" step="1" required placeholder="例如 45"></label>
        <label class="full">类型<select id="milkType"><option>Breast milk</option><option>Formula</option><option>Mixed</option></select></label>
      </div>
      <div class="actions" style="margin-top:12px"><button class="primary" type="submit">保存喂奶</button></div>
    </form>

    <form id="diaperForm" class="hidden">
      <div class="grid">
        <label class="full">时间<input id="diaperTime" type="datetime-local" required></label>
      </div>
      <div class="actions" style="margin-top:12px">
        <button class="quick" type="button" data-diaper="pee">💧 小便</button>
        <button class="quick" type="button" data-diaper="poop">💩 大便</button>
        <button class="quick" type="button" data-diaper="both">💧💩 两者都有</button>
      </div>
    </form>

    <form id="healthForm" class="hidden">
      <div class="grid">
        <label>时间<input id="healthTime" type="datetime-local" required></label>
        <label>Weight (g)<input id="weight" type="number" min="500" max="10000" step="1" placeholder="例如 2710"></label>
        <label>TcB<input id="tcb" type="number" min="0" max="40" step=".1" placeholder="例如 11.9"></label>
      </div>
      <div class="actions" style="margin-top:12px"><button class="primary" type="submit">保存体重 / TcB</button></div>
    </form>
    <div class="note">数据自动保存在这个浏览器设备中。关闭网页后仍会保留；清除浏览器网站数据、更换设备或浏览器时不会自动同步。</div>
  </section>

  <section class="panel">
    <div class="toprow"><h2>今天的记录</h2><button id="exportBtn" type="button">导出备份</button></div>
    <div id="todayEntries"></div>
  </section>

  <section class="panel">
    <h2>历史记录 / Daily Summary</h2>
    <div id="history"></div>
  </section>
</main>
<script>
(()=>{
const KEY='claireBabyTrackerV1';
let data=[];
try{data=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(data))data=[]}catch(e){data=[]}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const localDT=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey=s=>s.slice(0,10);
const today=()=>localDT().slice(0,10);
const fmt=s=>new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const save=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};
['feedTime','diaperTime','healthTime'].forEach(x=>$(x).value=localDT());
$('todayLabel').textContent=new Date().toLocaleDateString([], {weekday:'long',month:'long',day:'numeric',year:'numeric'});
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); b.classList.add('active');
 ['feedForm','diaperForm','healthForm'].forEach(x=>$(x).classList.add('hidden'));
 $({feed:'feedForm',diaper:'diaperForm',health:'healthForm'}[b.dataset.tab]).classList.remove('hidden');
}));
$('feedForm').addEventListener('submit',e=>{
 e.preventDefault(); const a=Math.round(Number($('amount').value));
 if(!a||a<1||a>300)return;
 data.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),kind:'feed',time:$('feedTime').value,amount:a,milkType:$('milkType').value});
 $('amount').value=''; $('feedTime').value=localDT(); save();
});
document.querySelectorAll('[data-diaper]').forEach(b=>b.addEventListener('click',()=>{
 data.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),kind:b.dataset.diaper,time:$('diaperTime').value});
 $('diaperTime').value=localDT(); save();
}));
$('healthForm').addEventListener('submit',e=>{
 e.preventDefault(); const w=$('weight').value?Number($('weight').value):null,t=$('tcb').value?Number($('tcb').value):null;
 if(w===null&&t===null)return;
 data.push({id:crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),kind:'health',time:$('healthTime').value,weight:w,tcb:t});
 $('weight').value='';$('tcb').value='';$('healthTime').value=localDT();save();
});
function label(x){
 if(x.kind==='feed')return `🍼 ${x.amount} mL · ${x.milkType}`;
 if(x.kind==='pee')return '💧 小便';
 if(x.kind==='poop')return '💩 大便';
 if(x.kind==='both')return '💧💩 大便 + 小便';
 let a=[];if(x.weight!=null)a.push(`⚖️ ${x.weight} g`);if(x.tcb!=null)a.push(`TcB ${x.tcb}`);return a.join(' · ');
}
function entryNode(x){
 const d=document.createElement('div');d.className='entry';
 const l=document.createElement('div');l.innerHTML=`<div class="entry-title">${label(x)}</div><div class="entry-meta">${fmt(x.time)}</div>`;
 const del=document.createElement('button');del.className='delete';del.type='button';del.textContent='删除';del.addEventListener('click',()=>{if(confirm('删除这条记录？')){data=data.filter(y=>y.id!==x.id);save()}});
 d.append(l,del);return d;
}
function render(){
 const td=today(), todays=data.filter(x=>dayKey(x.time)===td);
 $('milk').textContent=todays.filter(x=>x.kind==='feed').reduce((s,x)=>s+x.amount,0);
 $('feeds').textContent=todays.filter(x=>x.kind==='feed').length;
 $('pees').textContent=todays.filter(x=>x.kind==='pee'||x.kind==='both').length;
 $('poops').textContent=todays.filter(x=>x.kind==='poop'||x.kind==='both').length;
 const te=$('todayEntries');te.innerHTML='';
 const sorted=[...todays].sort((a,b)=>b.time.localeCompare(a.time));
 if(!sorted.length)te.innerHTML='<div class="empty">今天还没有记录。</div>'; else sorted.forEach(x=>te.appendChild(entryNode(x)));
 const days={}; data.forEach(x=>(days[dayKey(x.time)]??=[]).push(x));
 const h=$('history');h.innerHTML='';
 const keys=Object.keys(days).sort().reverse();
 if(!keys.length)h.innerHTML='<div class="empty">记录后，这里会自动生成每日汇总。</div>';
 keys.forEach(k=>{
   const a=days[k], fs=a.filter(x=>x.kind==='feed'), milk=fs.reduce((s,x)=>s+x.amount,0), pee=a.filter(x=>x.kind==='pee'||x.kind==='both').length, poop=a.filter(x=>x.kind==='poop'||x.kind==='both').length;
   const health=a.filter(x=>x.kind==='health').sort((x,y)=>y.time.localeCompare(x.time))[0];
   const div=document.createElement('div');div.className='day';
   let hs='';if(health){if(health.weight!=null)hs+=` · Weight ${health.weight} g`;if(health.tcb!=null)hs+=` · TcB ${health.tcb}`}
   div.innerHTML=`<div class="day-head">${new Date(k+'T12:00').toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}</div><div class="day-stats">🍼 ${milk} mL / ${fs.length} feeds · 💧 ${pee} wet · 💩 ${poop}${hs}</div>`;
   h.appendChild(div);
 });
}
$('exportBtn').addEventListener('click',()=>{
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='claire-baby-tracker-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);
});
render();
})();
</script>
</body>
</html>
